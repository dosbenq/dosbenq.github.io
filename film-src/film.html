<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  svg{display:block}
  .d{font-family:"Overpass","Arial Narrow",sans-serif}
  .m{font-family:"Overpass Mono",monospace}
</style></head>
<body>
<svg id="stage" width="1280" height="720" viewBox="0 0 1280 720"><defs id="defs"></defs></svg>
<script>
/* The Long Way Round: a code-drawn film. render(t) draws the frame at t seconds. */
const NS = 'http://www.w3.org/2000/svg';
const stage = document.getElementById('stage');
const defs = document.getElementById('defs');
const el = (tag, attrs = {}, parent = stage, text) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  parent.appendChild(e);
  return e;
};
const set = (e, attrs) => { for (const k in attrs) e.setAttribute(k, attrs[k]); };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const back = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));

const C = {
  ink: '#0b1220', navy: '#16213a', paper: '#ece5d3', dim: '#8f9ab0', sodium: '#f5a63d', rust: '#a3530a', signal: '#ff6b57', go: '#69d5ae',
  skin: '#c98b62', skinDark: '#a8704c', hair: '#271a14', jacket: '#1c1b1f', jacketHi: '#3a363b', tee: '#222a3e',
};

let gradId = 0;
function grad(stops) {
  const id = 'g' + (gradId++);
  const g = el('linearGradient', { id, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  stops.forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, g));
  return `url(#${id})`;
}

/* ============ AVATAR ============ */
// Flat illustration of Aditya: swept-up dark hair, thick brows, stubble,
// big smile, black leather jacket over a dark tee.
function avatar(parent, o = {}) {
  const g = el('g', {}, parent);
  const body = el('g', {}, g);
  if (o.backpack) {
    el('path', { d: 'M-96 150 Q-104 60 -70 40 L-58 44 Q-84 70 -78 150 Z', fill: '#3d5a80' }, body);
    el('path', { d: 'M96 150 Q104 60 70 40 L58 44 Q84 70 78 150 Z', fill: '#3d5a80' }, body);
  }
  el('path', { d: 'M-112 160 Q-110 52 -44 26 L44 26 Q110 52 112 160 Z', fill: C.jacket }, body);
  el('path', { d: 'M-26 26 L26 26 L16 160 L-16 160 Z', fill: C.tee }, body);
  el('path', { d: 'M-44 26 L-16 92 L-6 30 Z', fill: '#2c2a2f' }, body);
  el('path', { d: 'M44 26 L16 92 L6 30 Z', fill: '#2c2a2f' }, body);
  el('path', { d: 'M-96 70 Q-80 44 -50 38 Q-76 60 -82 96 Z', fill: C.jacketHi, opacity: .7 }, body);
  el('line', { x1: 14, y1: 92, x2: 10, y2: 160, stroke: '#77706a', 'stroke-width': 2 }, body);
  if (o.backpack) {
    el('path', { d: 'M-58 32 L-50 160', stroke: '#3d5a80', 'stroke-width': 12, 'stroke-linecap': 'round' }, body);
    el('path', { d: 'M58 32 L50 160', stroke: '#3d5a80', 'stroke-width': 12, 'stroke-linecap': 'round' }, body);
  }
  el('rect', { x: -15, y: -4, width: 30, height: 34, rx: 8, fill: C.skinDark }, g);
  const head = el('g', {}, g);
  el('ellipse', { cx: -45, cy: -36, rx: 8, ry: 13, fill: C.skinDark }, head);
  el('ellipse', { cx: 45, cy: -36, rx: 8, ry: 13, fill: C.skinDark }, head);
  el('path', { d: 'M-44 -56 Q-46 -2 -26 12 Q-12 22 0 22 Q12 22 26 12 Q46 -2 44 -56 Q44 -96 0 -96 Q-44 -96 -44 -56 Z', fill: C.skin }, head);
  el('path', { d: 'M-43 -30 Q-40 8 -24 16 Q-10 24 0 24 Q10 24 24 16 Q40 8 43 -30 Q34 -6 18 -8 Q0 -14 -18 -8 Q-34 -6 -43 -30 Z', fill: '#3a2418', opacity: .26 }, head);
  el('path', { d: 'M-47 -50 Q-56 -96 -18 -110 Q14 -124 44 -104 Q62 -90 50 -52 Q46 -74 30 -80 Q8 -88 -18 -82 Q-38 -76 -47 -50 Z', fill: C.hair }, head);
  el('path', { d: 'M-30 -96 Q-6 -132 34 -118 Q52 -110 54 -92 Q34 -112 6 -106 Q-14 -102 -30 -96 Z', fill: '#3b281f' }, head);
  el('path', { d: 'M-47 -50 Q-50 -64 -44 -74 L-40 -54 Z', fill: C.hair }, head);
  el('path', { d: 'M47 -48 Q52 -64 46 -78 L42 -52 Z', fill: C.hair }, head);
  el('rect', { x: -33, y: -60, width: 25, height: 7, rx: 3.5, fill: C.hair, transform: 'rotate(-4 -20 -56)' }, head);
  el('rect', { x: 8, y: -60, width: 25, height: 7, rx: 3.5, fill: C.hair, transform: 'rotate(4 20 -56)' }, head);
  const happy = el('g', { stroke: C.hair, 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round' }, head);
  el('path', { d: 'M-28 -40 Q-20 -47 -12 -40' }, happy);
  el('path', { d: 'M12 -40 Q20 -47 28 -40' }, happy);
  const open = el('g', { fill: C.hair }, head);
  el('ellipse', { cx: -20, cy: -40, rx: 4.5, ry: 5.5 }, open);
  el('ellipse', { cx: 20, cy: -40, rx: 4.5, ry: 5.5 }, open);
  el('path', { d: 'M-1 -34 Q-7 -18 1 -15', stroke: C.skinDark, 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round' }, head);
  const smile = el('path', { d: 'M-19 -3 Q0 16 19 -3 Q0 3 -19 -3 Z', fill: '#fff', stroke: '#5a2d22', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, head);
  const flat = el('path', { d: 'M-12 2 Q0 0 12 2', stroke: '#5a2d22', 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round' }, head);
  let arm = null;
  if (o.arm) {
    arm = el('g', {}, g);
    el('path', { d: 'M70 50 Q104 10 118 -56 L142 -50 Q130 20 92 70 Z', fill: C.jacket }, arm);
    el('circle', { cx: 131, cy: -66, r: 17, fill: C.skin }, arm);
    el('rect', { x: 122, y: -96, width: 8, height: 22, rx: 4, fill: C.skin, transform: 'rotate(-10 126 -85)' }, arm);
    el('rect', { x: 132, y: -98, width: 8, height: 24, rx: 4, fill: C.skin }, arm);
    el('rect', { x: 142, y: -94, width: 8, height: 22, rx: 4, fill: C.skin, transform: 'rotate(10 146 -83)' }, arm);
  }
  if (o.phone) {
    const phone = el('g', { transform: 'translate(-20 70) rotate(-8)' }, g);
    el('rect', { x: -34, y: -60, width: 68, height: 120, rx: 10, fill: '#0b1220', stroke: '#3a363b', 'stroke-width': 3 }, phone);
    el('rect', { x: -28, y: -52, width: 56, height: 104, rx: 6, fill: '#16223a' }, phone);
    el('circle', { cx: -40, cy: 30, r: 15, fill: C.skin }, phone);
    el('circle', { cx: 40, cy: 30, r: 15, fill: C.skin }, phone);
  }
  const api = {
    g, head, arm,
    mood(m) {
      happy.setAttribute('display', m === 'smile' ? 'inline' : 'none');
      open.setAttribute('display', m === 'smile' ? 'none' : 'inline');
      smile.setAttribute('display', m === 'neutral' ? 'none' : 'inline');
      flat.setAttribute('display', m === 'neutral' ? 'inline' : 'none');
    },
    blink(on) { open.setAttribute('transform', on ? 'translate(0 -40) scale(1 .1) translate(0 40)' : ''); },
    wave(t, start) {
      const w = prog(t, start, start + .4);
      arm.setAttribute('opacity', w);
      arm.setAttribute('transform', `rotate(${(1 - w) * 40 + Math.sin(t * 9) * 12 * w} 80 60)`);
    },
  };
  api.mood(o.mood || 'smile');
  return api;
}

/* side-view car with a small Aditya at the wheel */
function sideCar(parent) {
  const g = el('g', {}, parent);
  el('path', { d: 'M-150 -20 Q-148 -55 -110 -58 L-70 -60 Q-40 -105 10 -106 L55 -106 Q90 -104 115 -62 L150 -55 Q168 -50 168 -25 L168 -8 L-150 -8 Z', fill: C.signal }, g);
  el('path', { d: 'M-58 -62 Q-34 -97 8 -98 L30 -98 L30 -62 Z', fill: '#bfe3ff', opacity: .85 }, g);
  el('path', { d: 'M38 -98 L54 -98 Q84 -96 104 -62 L38 -62 Z', fill: '#bfe3ff', opacity: .85 }, g);
  const driver = el('g', { transform: 'translate(12 -70) scale(.3)' }, g);
  avatar(driver, {});
  el('path', { d: 'M-58 -62 L30 -62 L30 -58 L-58 -58 Z', fill: '#c2463a' }, g);
  el('rect', { x: -150, y: -30, width: 318, height: 4, fill: '#c2463a' }, g);
  el('circle', { cx: 160, cy: -36, r: 6, fill: '#fff6c8' }, g);
  el('rect', { x: -152, y: -42, width: 8, height: 10, rx: 2, fill: '#ffb3a6' }, g);
  const wheels = [-85, 105].map(x => {
    const w = el('g', {}, g);
    el('circle', { r: 30, fill: '#111' }, w); el('circle', { r: 14, fill: '#c9ced8' }, w);
    el('rect', { x: -2, y: -14, width: 4, height: 28, fill: '#555' }, w);
    return { w, x };
  });
  return { g, spin(a) { wheels.forEach(({ w, x }) => set(w, { transform: `translate(${x} -6) rotate(${a})` })); } };
}

function stars(parent, n, seed) {
  let s = seed;
  const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const g = el('g', {}, parent);
  for (let i = 0; i < n; i++) el('circle', { cx: r() * 1280, cy: r() * 460, r: r() * 1.6 + .4, fill: '#fff', opacity: r() * .7 + .3 }, g);
  return g;
}

function cloud(parent, x, y, s, fill, op) {
  const c = el('g', { transform: `translate(${x} ${y}) scale(${s})`, fill, opacity: op }, parent);
  el('ellipse', { cx: 0, cy: 0, rx: 70, ry: 26 }, c);
  el('circle', { cx: -26, cy: -14, r: 26 }, c);
  el('circle', { cx: 14, cy: -22, r: 32 }, c);
  return c;
}

function chip(parent, txt, bg, fg, size = 17) {
  const g = el('g', {}, parent);
  const w = txt.length * size * .78 + 44;
  el('rect', { x: -w / 2, y: -size * 1.5, width: w, height: size * 3, rx: size * 1.5, fill: bg }, g);
  el('text', { x: 0, y: size * .38, 'text-anchor': 'middle', class: 'm', 'font-size': size, 'letter-spacing': 2, fill: fg }, g, txt);
  return g;
}

/* ============ SCENES ============ */
// Each scene: wrap (used by transitions) > cam (slow push-in) > artwork.
const scenes = [];
function scene(start, end, build) {
  const wrap = el('g', { display: 'none' }, stage);
  const cam = el('g', {}, wrap);
  const draw = build(cam, end - start);
  scenes.push({ start, end, wrap, cam, draw });
}

// 1. Title: a bright morning on the open road
scene(0, 6.5, (g) => {
  el('rect', { width: 1280, height: 720, fill: grad([[0, '#8cc4ef'], [1, '#fff0d8']]) }, g);
  const glow = el('radialGradient', { id: 'sunGlow' }, defs);
  el('stop', { offset: 0, 'stop-color': '#fff8e1', 'stop-opacity': 1 }, glow);
  el('stop', { offset: 1, 'stop-color': '#fff8e1', 'stop-opacity': 0 }, glow);
  el('circle', { cx: 1040, cy: 170, r: 220, fill: 'url(#sunGlow)' }, g);
  el('circle', { cx: 1040, cy: 170, r: 70, fill: '#fffaf0' }, g);
  const clouds = el('g', {}, g);
  [[160, 130, 1.2], [520, 90, .9], [820, 210, 1], [1250, 120, 1.1], [1500, 200, .8]].forEach(([x, y, s]) => cloud(clouds, x, y, s, '#fff', .9));
  el('path', { d: 'M0 520 Q320 440 640 500 Q960 560 1280 470 L1280 720 L0 720 Z', fill: '#9cc99a' }, g);
  el('path', { d: 'M0 580 Q420 520 760 570 Q1040 610 1280 560 L1280 720 L0 720 Z', fill: '#7fb07e' }, g);
  el('path', { d: 'M560 720 L660 560 L700 560 L900 720 Z', fill: '#3a4152' }, g);
  const title = el('text', { x: 640, y: 150, 'text-anchor': 'middle', class: 'd', 'font-size': 82, 'font-weight': 900, fill: C.navy }, g, 'The Long Way Round');
  const sub = el('text', { x: 640, y: 198, 'text-anchor': 'middle', class: 'm', 'font-size': 18, 'letter-spacing': 5, fill: C.rust }, g, 'A SHORT FILM ABOUT ADITYA AGGARWAL');
  const holder = el('g', {}, g);
  const av = avatar(holder, { arm: true });
  return t => {
    set(clouds, { transform: `translate(${-t * 14} 0)` });
    title.setAttribute('opacity', prog(t, .2, .9));
    set(title, { y: 150 + (1 - ease(prog(t, .2, .9))) * 16 });
    sub.setAttribute('opacity', prog(t, .6, 1.3));
    const pop = back(prog(t, .8, 1.5));
    set(holder, { transform: `translate(640 ${575 + (1 - pop) * 80}) scale(${1.2 * Math.max(.01, pop)})` });
    av.wave(t, 1.7);
  };
});

// 2. Delhi: engineering and economics
scene(6.5, 16, (g) => {
  el('rect', { width: 1280, height: 720, fill: grad([[0, '#f39f6a'], [1, '#ffe6c4']]) }, g);
  el('circle', { cx: 1040, cy: 470, r: 120, fill: '#fff0c8', opacity: .8 }, g);
  const city = el('g', { fill: '#c0705a' }, g);
  el('path', { d: 'M80 560 L80 430 Q150 370 220 430 L220 560 L185 560 L185 455 Q150 415 115 455 L115 560 Z' }, city);
  el('rect', { x: 70, y: 415, width: 160, height: 18 }, city);
  el('path', { d: 'M1120 560 L1132 300 L1148 300 L1160 560 Z' }, city);
  for (let i = 0; i < 8; i++) el('rect', { x: 260 + i * 105, y: 500 - (i * 37 % 60), width: 80, height: 80 }, city);
  const holder = el('g', { transform: 'translate(640 470)' }, g);
  const av = avatar(holder, {});
  el('rect', { x: 250, y: 560, width: 780, height: 30, rx: 6, fill: '#6b4636' }, g);
  el('rect', { x: 250, y: 590, width: 780, height: 130, fill: '#4f3328' }, g);
  el('rect', { x: 520, y: 520, width: 240, height: 40, rx: 4, fill: '#cfd6e2' }, g);
  el('rect', { x: 540, y: 528, width: 200, height: 4, rx: 2, fill: '#8f9ab0' }, g);
  const mk = (x, y, label, color) => {
    const c = el('g', {}, g);
    el('circle', { cx: 0, cy: 0, r: 44, fill: color }, c);
    el('text', { x: 0, y: 14, 'text-anchor': 'middle', class: 'd', 'font-size': 40, 'font-weight': 900, fill: '#0b1220' }, c, label);
    return { c, x, y };
  };
  const left = [mk(250, 290, 'π', '#cfe8ff'), mk(150, 420, '∑', '#cfe8ff'), mk(380, 190, '⚙', '#cfe8ff'), mk(420, 370, 'Ω', '#cfe8ff')];
  const right = [mk(1030, 290, '$', '#ffe08a'), mk(1130, 420, '₹', '#ffe08a'), mk(900, 190, '↗', '#ffe08a'), mk(870, 370, '%', '#ffe08a')];
  const lt = el('text', { x: 290, y: 130, 'text-anchor': 'middle', class: 'm', 'font-size': 20, 'letter-spacing': 6, fill: C.navy }, g, 'ENGINEERING');
  const rt = el('text', { x: 1000, y: 130, 'text-anchor': 'middle', class: 'm', 'font-size': 20, 'letter-spacing': 6, fill: C.navy }, g, 'ECONOMICS');
  return t => {
    av.blink(t % 3.1 > 2.95);
    left.forEach((o, i) => {
      const p = back(prog(t, .8 + i * .25, 1.3 + i * .25));
      set(o.c, { transform: `translate(${o.x} ${o.y + Math.sin(t * 2 + i) * 8}) scale(${Math.max(.01, p)})` });
    });
    right.forEach((o, i) => {
      const p = back(prog(t, 4.8 + i * .25, 5.3 + i * .25));
      set(o.c, { transform: `translate(${o.x} ${o.y + Math.sin(t * 2 + i + 1) * 8}) scale(${Math.max(.01, p)})` });
    });
    lt.setAttribute('opacity', prog(t, .8, 1.4));
    rt.setAttribute('opacity', prog(t, 4.8, 5.4));
  };
});

// 3. Bengaluru: HARMAN, signs from the map
scene(16, 28, (g) => {
  el('rect', { width: 1280, height: 720, fill: grad([[0, '#3f86d6'], [1, '#c6e6ff']]) }, g);
  el('circle', { cx: 1080, cy: 150, r: 70, fill: '#fff3c4', opacity: .9 }, g);
  const sky = el('g', {}, g);
  [[200, 120, 1], [700, 80, .8], [1100, 230, .9], [1500, 140, 1]].forEach(([x, y, s]) => cloud(sky, x, y, s, '#fff', .75));
  const far = el('g', {}, g);
  for (let k = 0; k < 2; k++) for (let i = 0; i < 14; i++) {
    const h = 120 + (i * 73 % 180), w = 70 + (i * 29 % 50), x = k * 1600 + i * 115;
    el('rect', { x, y: 560 - h, width: w, height: h, fill: '#33476b' }, far);
    for (let r = 0; r < h / 26 - 1; r++) el('rect', { x: x + 10, y: 560 - h + 12 + r * 26, width: w - 20, height: 8, fill: '#4f6a96', opacity: .6 }, far);
  }
  el('rect', { y: 560, width: 1280, height: 160, fill: '#55704f' }, g);
  el('rect', { y: 575, width: 1280, height: 90, fill: '#2a2f3a' }, g);
  const dashes = el('g', {}, g);
  for (let i = 0; i < 24; i++) el('rect', { x: i * 80, y: 617, width: 44, height: 6, fill: '#e9e2cf' }, dashes);
  const signs = [50, 80, 30, 60, 70, 50].map((v, i) => {
    const s = el('g', {}, g);
    el('rect', { x: -3, y: -100, width: 6, height: 110, fill: '#9aa3b2' }, s);
    el('circle', { cx: 0, cy: -120, r: 28, fill: '#fff', stroke: '#d62f2f', 'stroke-width': 7 }, s);
    el('text', { x: 0, y: -111, 'text-anchor': 'middle', class: 'd', 'font-size': 24, 'font-weight': 900, fill: '#111' }, s, v);
    const tag = el('g', { opacity: 0 }, s);
    el('rect', { x: -44, y: -186, width: 88, height: 26, rx: 13, fill: C.ink }, tag);
    el('text', { x: 0, y: -168, 'text-anchor': 'middle', class: 'm', 'font-size': 12, 'letter-spacing': 2, fill: C.go }, tag, 'FROM MAP');
    return { s, tag, i };
  });
  const car = sideCar(g);
  const cam = el('g', { transform: 'translate(1000 40)' }, g);
  el('rect', { width: 240, height: 44, rx: 10, fill: C.ink, opacity: .9 }, cam);
  const camDot = el('circle', { cx: 24, cy: 22, r: 7, fill: C.go }, cam);
  const camTxt = el('text', { x: 42, y: 28, class: 'm', 'font-size': 15, 'letter-spacing': 2, fill: C.paper }, cam, 'CAMERA ON');
  return t => {
    const speed = t * 420;
    set(sky, { transform: `translate(${-t * 20} 0)` });
    set(far, { transform: `translate(${-(speed * .18) % 1600} 0)` });
    set(dashes, { transform: `translate(${-speed % 80} 0)` });
    // the car arrives with the wipe, so it is already in place from the start
    set(car.g, { transform: `translate(430 ${612 + Math.sin(t * 18) * 1.5})`, display: t >= .75 ? 'inline' : 'none' });
    car.spin(speed * 2);
    const blind = t > 5.8;
    camDot.setAttribute('fill', blind ? C.signal : C.go);
    camTxt.textContent = blind ? 'CAMERA BLIND' : 'CAMERA ON';
    signs.forEach(o => {
      const x = 1400 + o.i * 380 - (speed - 1200);
      set(o.s, { transform: `translate(${x} 585)` });
      o.tag.setAttribute('opacity', blind && x < 900 ? 1 : 0);
    });
  };
});

// 4. The doubt
scene(28, 36.5, (g) => {
  el('rect', { width: 1280, height: 720, fill: '#e3e9f1' }, g);
  el('rect', { x: 820, y: 90, width: 360, height: 300, rx: 8, fill: '#9cc6ee' }, g);
  for (let i = 0; i < 5; i++) el('rect', { x: 840 + i * 68, y: 390 - (90 + i * 37 % 120), width: 52, height: 90 + i * 37 % 120, fill: '#5d79a8' }, g);
  el('rect', { x: 820, y: 90, width: 360, height: 300, rx: 8, fill: 'none', stroke: '#c9d3e0', 'stroke-width': 14 }, g);
  const holder = el('g', { transform: 'translate(560 470)' }, g);
  const av = avatar(holder, { mood: 'neutral' });
  el('rect', { x: 160, y: 560, width: 960, height: 30, rx: 6, fill: '#8a9bb3' }, g);
  el('rect', { x: 160, y: 590, width: 960, height: 130, fill: '#6f8099' }, g);
  const tickets = [];
  for (let i = 0; i < 7; i++) {
    const tk = el('g', {}, g);
    el('rect', { x: -80, y: -16, width: 160, height: 32, rx: 6, fill: '#fff', stroke: '#c9d3e0' }, tk);
    el('text', { x: -66, y: 6, class: 'm', 'font-size': 14, fill: '#16213a' }, tk, `TASK #${4127 + i}`);
    tickets.push(tk);
  }
  const bubble = el('g', { opacity: 0 }, g);
  el('circle', { cx: 650, cy: 330, r: 8, fill: '#fff' }, bubble);
  el('circle', { cx: 680, cy: 290, r: 14, fill: '#fff' }, bubble);
  el('ellipse', { cx: 780, cy: 200, rx: 130, ry: 80, fill: '#fff' }, bubble);
  el('text', { x: 780, y: 190, 'text-anchor': 'middle', class: 'd', 'font-size': 30, 'font-weight': 900, fill: '#16213a' }, bubble, 'Does this make');
  el('text', { x: 780, y: 226, 'text-anchor': 'middle', class: 'd', 'font-size': 30, 'font-weight': 900, fill: '#a3530a' }, bubble, 'business sense?');
  return t => {
    av.blink(t % 2.7 > 2.55);
    tickets.forEach((tk, i) => {
      const p = ease(prog(t, .5 + i * .55, 1 + i * .55));
      set(tk, { transform: `translate(${900 - (i % 2) * 14} ${lerp(-60, 540 - i * 34, p)}) rotate(${(i % 3 - 1) * 3})` });
    });
    const b = back(prog(t, 3.2, 3.8));
    bubble.setAttribute('opacity', prog(t, 3.2, 3.5));
    set(bubble, { transform: `translate(700 300) scale(${Math.max(.01, b)}) translate(-700 -300)` });
  };

/* ============ TRANSITIONS ============ */
// One per scene boundary, each borrowed from the story: an iris from the
// avatar, the car wiping into Bengaluru, a zoom into an office tower, a tilt
// down to the map, a pan after the turning car, clouds on landing, a route
// line, and an iris out of the phone.
const TRANS = [
  { at: 6.5, d: 1.1, type: 'iris', x: 640, y: 470 },
  { at: 16, d: 1.5, type: 'carwipe' },
  { at: 28, d: 1.1, type: 'zoom', x: 735, y: 330 },
  { at: 36.5, d: 1.0, type: 'tilt' },
  { at: 44, d: 1.0, type: 'push' },
  { at: 51, d: 1.6, type: 'clouds' },
  { at: 65, d: 1.1, type: 'band' },
  { at: 74, d: 1.2, type: 'iris', x: 620, y: 540, ring: true },
];
scenes.forEach((s, i) => {
  const tin = TRANS.find(tr => tr.at === s.start), tout = TRANS.find(tr => tr.at === s.end);
  s.from = tin ? s.start - tin.d / 2 : s.start;
  s.to = tout ? s.end + tout.d / 2 : s.end;
  const cp = el('clipPath', { id: 'clip' + i, clipPathUnits: 'userSpaceOnUse' }, defs);
  s.clip = el('path', { d: '' }, cp);
  s.clipId = 'url(#clip' + i + ')';
});

const overlay = el('g', {});
const wipeCar = sideCar(overlay);
const cloudBand = el('g', {}, overlay);
for (let i = 0; i < 26; i++) cloud(cloudBand, (i % 7) * 110 - 380 + (i * 37 % 60), (Math.floor(i / 7)) * 210 + 40 + (i * 53 % 80), 3.2, '#ffffff', .97);
const band = el('path', { fill: C.sodium }, overlay);
const ring = el('circle', { fill: 'none', stroke: C.sodium, 'stroke-width': 14 }, overlay);
const circlePath = (x, y, r) => `M${x - r} ${y} a${r} ${r} 0 1 0 ${2 * r} 0 a${r} ${r} 0 1 0 ${-2 * r} 0 Z`;

function applyTransition(tr, p, out, inc) {
  const e = ease(p);
  if (tr.type === 'iris') {
    const r = lerp(0, 1500, e);
    set(inc.wrap, { 'clip-path': inc.clipId });
    inc.clip.setAttribute('d', circlePath(tr.x, tr.y, r));
    set(out.wrap, { transform: `translate(${tr.x} ${tr.y}) scale(${1 + .12 * e}) translate(${-tr.x} ${-tr.y})` });
    if (tr.ring) { ring.setAttribute('display', 'inline'); set(ring, { cx: tr.x, cy: tr.y, r, opacity: 1 - e }); }
  } else if (tr.type === 'carwipe') {
    // the car drives in revealing Bengaluru behind it, parks in its scene
    // position, and the reveal races on ahead to the right edge
    const k = clamp(p / .55);
    const carX = lerp(-260, 430, 1 - Math.pow(1 - k, 2));
    const edge = p < .55 ? carX - 40 : lerp(390, 1600, ease((p - .55) / .45));
    set(inc.wrap, { 'clip-path': inc.clipId });
    inc.clip.setAttribute('d', `M-10 -10 H${edge} V730 H-10 Z`);
    wipeCar.g.setAttribute('display', 'inline');
    set(wipeCar.g, { transform: `translate(${carX} ${612 + Math.sin(p * 40) * 1.5})` });
    wipeCar.spin(p * 1400);
  } else if (tr.type === 'zoom') {
    // fly into a lit office window that opens up into the next scene
    set(out.wrap, { transform: `translate(${tr.x} ${tr.y}) scale(${1 + 2.4 * e}) translate(${-tr.x} ${-tr.y})` });
    const w = lerp(40, 1500, e), h = lerp(30, 900, e);
    const cx = lerp(tr.x, 640, e), cy = lerp(tr.y, 360, e), r = lerp(4, 0, e);
    set(inc.wrap, { 'clip-path': inc.clipId });
    inc.clip.setAttribute('d', `M${cx - w / 2 + r} ${cy - h / 2} H${cx + w / 2 - r} V${cy + h / 2} H${cx - w / 2} Z`);
  } else if (tr.type === 'tilt') {
    set(out.wrap, { transform: `translate(0 ${-720 * e})` });
    set(inc.wrap, { transform: `translate(0 ${720 * (1 - e)})` });
  } else if (tr.type === 'push') {
    set(out.wrap, { transform: `translate(${-1280 * e} 0)` });
    set(inc.wrap, { transform: `translate(${1280 * (1 - e)} 0)` });
  } else if (tr.type === 'clouds') {
    const cx = lerp(1700, -1100, p);
    cloudBand.setAttribute('display', 'inline');
    set(cloudBand, { transform: `translate(${cx} 0)` });
    set(inc.wrap, { 'clip-path': inc.clipId });
    inc.clip.setAttribute('d', `M${cx} -10 H1300 V730 H${cx} Z`);
  } else if (tr.type === 'band') {
    const X = lerp(-340, 1640, e);
    set(inc.wrap, { 'clip-path': inc.clipId });
    inc.clip.setAttribute('d', `M-10 -10 L${X} -10 L${X - 300} 730 L-10 730 Z`);
    band.setAttribute('display', 'inline');
    band.setAttribute('d', `M${X} -10 L${X + 46} -10 L${X - 254} 730 L${X - 300} 730 Z`);
  }
}

  [28.6, 32.4, 'But I kept having business doubts.|Engineers get tasks, not a vote.'],
  [32.6, 36.0, "Too much effort went into things|that didn't make business sense."],
  [37.0, 40.4, 'I wanted to help decide what gets built,|not only how.'],
  [40.6, 43.6, 'So: recalculating. Engineering → Product.'],
  [44.6, 50.6, "2025. The US is at the forefront of AI,|and I wanted to be where it's being built."],

  [59.2, 62.2, 'Design Thinking taught me how to run|real customer interviews.'],

function render(t) {
  overlay.querySelectorAll(':scope > *').forEach(n => n.setAttribute('display', 'none'));
  scenes.forEach(s => {
    const on = t >= s.from && t < s.to;
    s.wrap.setAttribute('display', on ? 'inline' : 'none');
    if (!on) return;
    s.wrap.removeAttribute('clip-path');
    s.wrap.removeAttribute('transform');
    s.wrap.setAttribute('opacity', 1);
    const k = 1 + .045 * clamp((t - s.from) / (s.to - s.from));
    set(s.cam, { transform: `translate(640 360) scale(${k}) translate(-640 -360)` });
    s.draw(t - s.start);
  });
  TRANS.forEach((tr, i) => {
    const a = tr.at - tr.d / 2;
    if (t >= a && t < tr.at + tr.d / 2) applyTransition(tr, (t - a) / tr.d, scenes[i], scenes[i + 1]);
  });

  odo.setAttribute('opacity', prog(t, 6.9, 7.5) * (1 - prog(t, 81, 82)));
  let k = ODO.findIndex(o => t < o[0]);
  if (k < 1) k = 1;
  const [t0, y0, p0] = ODO[k - 1], [t1, y1] = ODO[k];
  const y = lerp(y0, y1, clamp((t - t0) / (t1 - t0)));
  odoVal.textContent = `${MONTHS[Math.floor((y % 1) * 12)]} ${Math.floor(y)}`;
  odoPlace.textContent = p0;

  const cap = CAPTIONS.find(c => t >= c[0] && t < c[1]);
  if (!cap) { capG.setAttribute('opacity', 0); return; }
  const lines = cap[2].split('|');
  capText.textContent = '';
  lines.forEach((l, i) => el('tspan', { x: 640, dy: i ? '1.25em' : 0 }, capText, l));
  const h = lines.length * 35 + 22, w = Math.max(...lines.map(l => l.length)) * 14.5 + 60;
  const top = 700 - h;
  set(capText, { x: 640, y: top + 40 });
  set(capBg, { x: 640 - w / 2, y: top, width: w, height: h });
  const a = clamp(Math.min(t - cap[0], cap[1] - t) / .3);
  capG.setAttribute('opacity', a);
  set(capG, { transform: `translate(0 ${(1 - a) * 10})` });
}
window.render = render;
window.DURATION = 85;
render(0);
</script>
